<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Figma System</title>


  <style>

    /* ========================================================
       RESET
    ======================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f7f7f5;
      color: #18181b;
    }


    body {
      overflow: hidden;
    }


    button {
      font: inherit;
    }


    /* ========================================================
       APP
    ======================================================== */

    .app {
      display: flex;

      flex-direction: column;

      width: 100%;
      height: 100%;
    }


    /* ========================================================
       HEADER
    ======================================================== */

    .header {
      height: 60px;

      padding: 0 18px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      background: #ffffff;

      border-bottom: 1px solid #e4e4e7;
    }


    .brand {
      display: flex;

      align-items: center;

      gap: 9px;
    }


    .brand-mark {
      width: 28px;
      height: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 7px;

      background: #18181b;
      color: #ffffff;

      font-size: 11px;
      font-weight: 700;
    }


    .brand-name {
      font-size: 14px;
      font-weight: 650;
    }


    .status {
      display: flex;

      align-items: center;

      gap: 6px;

      font-size: 11px;

      color: #71717a;
    }


    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;
    }


    /* ========================================================
       CONTENT
    ======================================================== */

    .main {
      flex: 1;

      overflow-y: auto;

      padding: 20px;
    }


    /* ========================================================
       INTRO
    ======================================================== */

    .eyebrow {
      margin-bottom: 6px;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      color: #71717a;
    }


    h1 {
      margin: 0 0 7px;

      font-size: 23px;

      line-height: 1.15;

      letter-spacing: -0.6px;
    }


    .intro-text {
      margin: 0 0 20px;

      font-size: 12px;

      line-height: 1.5;

      color: #71717a;
    }


    /* ========================================================
       SECTION
    ======================================================== */

    .section {
      margin-bottom: 14px;
    }


    .section-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 7px;
    }


    .section-title {
      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.06em;

      color: #52525b;
    }


    /* ========================================================
       SELECTION CARD
    ======================================================== */

    .card {
      background: #ffffff;

      border: 1px solid #e4e4e7;

      border-radius: 10px;

      padding: 14px;
    }


    .selection-summary {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 10px 11px;

      border-radius: 7px;

      background: #f4f4f5;
    }


    .selection-label {
      font-size: 11px;

      color: #71717a;
    }


    .selection-value {
      font-size: 13px;

      font-weight: 700;
    }


    /* ========================================================
       BUTTONS
    ======================================================== */

    .actions {
      display: flex;

      gap: 8px;

      margin-top: 10px;
    }


    button {
      min-height: 36px;

      padding: 0 13px;

      border: 1px solid #d4d4d8;

      border-radius: 7px;

      background: #ffffff;

      color: #18181b;

      cursor: pointer;

      font-size: 11px;

      font-weight: 650;
    }


    button:hover {
      background: #f4f4f5;
    }


    button:active {
      transform: translateY(1px);
    }


    .primary {
      flex: 1;

      border-color: #18181b;

      background: #18181b;

      color: #ffffff;
    }


    .primary:hover {
      background: #27272a;
    }


    /* ========================================================
       INSPECTION
    ======================================================== */

    .inspection {
      display: none;
    }


    .inspection.visible {
      display: block;
    }


    .empty {
      padding: 18px 10px;

      text-align: center;

      color: #71717a;

      font-size: 11px;

      line-height: 1.5;
    }


    /* ========================================================
       NODE
    ======================================================== */

    .node {
      padding: 12px;

      margin-bottom: 8px;

      border: 1px solid #e4e4e7;

      border-radius: 8px;

      background: #ffffff;
    }


    .node:last-child {
      margin-bottom: 0;
    }


    .node-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }


    .node-name {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 700;
    }


    .node-type {
      flex-shrink: 0;

      padding: 3px 6px;

      border-radius: 5px;

      background: #f4f4f5;

      color: #71717a;

      font-size: 9px;

      font-weight: 700;
    }


    /* ========================================================
       PROPERTY GRID
    ======================================================== */

    .properties {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 6px;
    }


    .property {
      padding: 8px;

      border-radius: 6px;

      background: #f7f7f5;
    }


    .property-label {
      margin-bottom: 3px;

      font-size: 9px;

      color: #a1a1aa;

      text-transform: uppercase;

      letter-spacing: 0.04em;
    }


    .property-value {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 11px;

      font-weight: 600;

      color: #27272a;
    }


    /* ========================================================
       TEXT DETAILS
    ======================================================== */

    .text-details {
      margin-top: 8px;

      padding: 9px;

      border-radius: 6px;

      background: #f7f7f5;
    }


    .text-content {
      margin-bottom: 7px;

      font-size: 11px;

      line-height: 1.4;

      color: #27272a;

      word-break: break-word;
    }


    /* ========================================================
       FOOTER
    ======================================================== */

    .footer {
      min-height: 38px;

      display: flex;

      align-items: center;

      padding: 0 18px;

      border-top: 1px solid #e4e4e7;

      background: #ffffff;

      color: #a1a1aa;

      font-size: 9px;
    }

  </style>

</head>


<body>

  <div class="app">


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="header">

      <div class="brand">

        <div class="brand-mark">
          FS
        </div>

        <div class="brand-name">
          Figma System
        </div>

      </div>


      <div class="status">

        <span class="status-dot"></span>

        <span>
          Connected
        </span>

      </div>

    </header>


    <!-- ======================================================
         MAIN
    ======================================================= -->

    <main class="main">


      <div class="eyebrow">
        Design System Toolkit
      </div>


      <h1>
        Inspect your design.
      </h1>


      <p class="intro-text">
        Select layers in Figma to inspect their
        real document properties.
      </p>


      <!-- ====================================================
           SELECTION
      ===================================================== -->

      <section class="section">

        <div class="section-header">

          <div class="section-title">
            Current Selection
          </div>

        </div>


        <div class="card">

          <div class="selection-summary">

            <span class="selection-label">
              Selected layers
            </span>

            <span
              id="selection-count"
              class="selection-value"
            >
              0
            </span>

          </div>


          <div class="actions">

            <button
              id="inspect-selection"
              class="primary"
            >
              Inspect Selection
            </button>


            <button
              id="close"
            >
              Close
            </button>

          </div>

        </div>

      </section>


      <!-- ====================================================
           INSPECTION
      ===================================================== -->

      <section
        id="inspection-section"
        class="section inspection"
      >

        <div class="section-header">

          <div class="section-title">
            Inspection
          </div>

        </div>


        <div
          id="inspection-content"
        ></div>

      </section>


    </main>


    <!-- ======================================================
         FOOTER
    ======================================================= -->

    <footer class="footer">
      Figma System · Development Build
    </footer>


  </div>


  <script>

    // ========================================================
    // MESSAGE BRIDGE
    // ========================================================

    function sendMessage(message) {

      parent.postMessage(
        {
          pluginMessage: message
        },
        "*"
      );

    }


    // ========================================================
    // DOM
    // ========================================================

    const selectionCount =
      document.getElementById(
        "selection-count"
      );


    const inspectButton =
      document.getElementById(
        "inspect-selection"
      );


    const closeButton =
      document.getElementById(
        "close"
      );


    const inspectionSection =
      document.getElementById(
        "inspection-section"
      );


    const inspectionContent =
      document.getElementById(
        "inspection-content"
      );


    // ========================================================
    // Formatting
    // ========================================================

    function formatNumber(
      value,
      decimals = 2
    ) {

      if (
        typeof value !== "number"
        || !Number.isFinite(value)
      ) {
        return "—";
      }


      return value
        .toFixed(decimals)
        .replace(/\.00$/, "");

    }


    function formatOpacity(
      value
    ) {

      if (value === null) {
        return "—";
      }


      return `${Math.round(value * 100)}%`;

    }


    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ========================================================
    // Render Selection
    // ========================================================

    function renderSelection(
      selection
    ) {

      const count =
        selection?.count ?? 0;


      selectionCount.textContent =
        String(count);


      if (count === 0) {

        inspectionSection.classList.remove(
          "visible"
        );


        inspectionContent.innerHTML =
          "";


        return;

      }

    }


    // ========================================================
    // Render Inspection
    // ========================================================

    function renderInspection(
      selection
    ) {

      const nodes =
        selection?.nodes ?? [];


      selectionCount.textContent =
        String(
          selection?.count ?? nodes.length
        );


      inspectionSection.classList.add(
        "visible"
      );


      if (nodes.length === 0) {

        inspectionContent.innerHTML = `
          <div class="card">
            <div class="empty">
              No layers are currently selected.
            </div>
          </div>
        `;

        return;

      }


      inspectionContent.innerHTML =
        nodes.map(
          (node) => {

            const text =
              node.text;


            return `
              <div class="node">

                <div class="node-header">

                  <div
                    class="node-name"
                    title="${escapeHtml(node.name)}"
                  >
                    ${escapeHtml(node.name)}
                  </div>

                  <div class="node-type">
                    ${escapeHtml(node.type)}
                  </div>

                </div>


                <div class="properties">


                  <div class="property">

                    <div class="property-label">
                      Position
                    </div>

                    <div class="property-value">
                      ${formatNumber(node.x)},
                      ${formatNumber(node.y)}
                    </div>

                  </div>


                  <div class="property">

                    <div class="property-label">
                      Size
                    </div>

                    <div class="property-value">
                      ${formatNumber(node.width)}
                      ×
                      ${formatNumber(node.height)}
                    </div>

                  </div>


                  <div class="property">

                    <div class="property-label">
                      Fills
                    </div>

                    <div class="property-value">
                      ${node.fills}
                    </div>

                  </div>


                  <div class="property">

                    <div class="property-label">
                      Strokes
                    </div>

                    <div class="property-value">
                      ${node.strokes}
                    </div>

                  </div>


                  <div class="property">

                    <div class="property-label">
                      Radius
                    </div>

                    <div class="property-value">
                      ${
                        node.cornerRadius ?? "—"
                      }
                    </div>

                  </div>


                  <div class="property">

                    <div class="property-label">
                      Opacity
                    </div>

                    <div class="property-value">
                      ${
                        formatOpacity(
                          node.opacity
                        )
                      }
                    </div>

                  </div>


                </div>


                ${
                  text
                    ? `
                      <div class="text-details">

                        <div class="property-label">
                          Text
                        </div>

                        <div class="text-content">
                          ${escapeHtml(
                            text.characters
                          )}
                        </div>

                        <div class="property">

                          <div class="property-label">
                            Font Size
                          </div>

                          <div class="property-value">
                            ${
                              text.fontSize !== null
                                ? `${formatNumber(text.fontSize)} px`
                                : "—"
                            }
                          </div>

                        </div>

                      </div>
                    `
                    : ""
                }

              </div>
            `;

          }
        ).join("");

    }


    // ========================================================
    // Inspect Button
    // ========================================================

    inspectButton.addEventListener(
      "click",
      () => {

        sendMessage({
          type: "inspect-selection"
        });

      }
    );


    // ========================================================
    // Close
    // ========================================================

    closeButton.addEventListener(
      "click",
      () => {

        sendMessage({
          type: "close-plugin"
        });

      }
    );


    // ========================================================
    // Plugin → UI
    // ========================================================

    window.onmessage = (
      event
    ) => {

      const message =
        event.data.pluginMessage;


      if (!message) {
        return;
      }


      switch (message.type) {


        // ----------------------------------------------------
        // Plugin Ready
        // ----------------------------------------------------

        case "plugin-ready": {

          renderSelection(
            message.selection
          );

          break;

        }


        // ----------------------------------------------------
        // Automatic Selection Update
        // ----------------------------------------------------

        case "selection-info": {

          renderSelection(
            message.selection
          );

          break;

        }


        // ----------------------------------------------------
        // Inspection Result
        // ----------------------------------------------------

        case "selection-inspection": {

          renderInspection(
            message.selection
          );

          break;

        }

      }

    };


    // ========================================================
    // Tell Plugin UI Is Ready
    // ========================================================

    sendMessage({
      type: "ui-ready"
    });

  </script>

</body>

</html>
